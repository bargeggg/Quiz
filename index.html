<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070a14" />
  <title>Interactive Quiz Show: Transition Words & Connectors</title>

  <!-- Prevent Aggressive Browser Caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Modern Fonts & Styles -->
  <link rel="stylesheet" href="assets/style.css" />

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Local App Modules -->
  <script src="assets/audio.js"></script>
</head>

<body>
  <div class="container">

    <!-- Top Navigation Header -->
    <header class="top-navbar">
      <div class="brand-wrapper">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <polygon
              points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
            </polygon>
          </svg>
        </div>
        <div class="brand-info">
          <h1 class="brand-title">Transition Words Quiz</h1>
          <div class="brand-subtitle">Interactive Presentation • Elsa • Sofia • Irfan • Ahmad</div>
        </div>
      </div>

      <!-- Right Header: Sound FX Toggle (Pojok Kanan Atas) -->
      <div class="header-controls">
        <button class="sfx-toggle-btn" onclick="toggleSFX()" id="sfxToggleBtn" title="Toggle Sound Effects">
          <span id="sfxIconWrap">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
          </span>
        </button>
      </div>
    </header>

    <!-- Main Question View (Pure Multiple Choice Quiz) -->
    <div id="tabContentPg" class="tab-pane active" style="display:block;">

      <!-- Question Jump Strip (Navigator) -->
      <div class="question-strip-wrapper">
        <div class="question-pills-grid" id="questionPillsContainer">
          <!-- Circular Pills 1 to 13 generated via JS -->
        </div>
        <div class="strip-actions-row">
          <span id="stripScoreBadgeContainer"></span>
          <button class="btn-reset-session" onclick="resetAllQuestions()" title="Reset semua jawaban untuk sesi kuis baru">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 2v6h-6"></path>
              <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
              <path d="M3 22v-6h6"></path>
              <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
            </svg>
            <span>Reset Jawaban</span>
            <span class="badge-reset-count" id="badgeResetCount"></span>
          </button>
        </div>
      </div>

      <!-- Completion Banner when all 13 questions are answered -->
      <div id="completionBannerContainer"></div>

      <!-- Focus Game Show Card -->
      <div id="focusModeContainer">
        <div class="focus-question-box" id="currentFocusCard">
          <div style="text-align:center; padding: 40px; color: var(--text-dim);">Loading interactive question bank...</div>
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav-row">
          <button class="btn btn-secondary btn-nav" onclick="prevQuestion()" id="btnPrevQ">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Previous</span>
          </button>

          <button class="btn btn-primary btn-nav" onclick="nextQuestion()" id="btnNextQ">
            <span>Next Question</span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>
      </div>

    </div>

  </div>

  <!-- Final Score Celebration Modal -->
  <div class="score-modal-overlay" id="quizScoreModal" onclick="handleScoreModalOverlayClick(event)">
    <div class="score-modal-card" role="dialog" aria-modal="true" aria-labelledby="scoreModalTitle">
      <button class="score-modal-close" onclick="closeScoreModal()" aria-label="Tutup Ringkasan Skor">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <div class="score-modal-header">
        <div class="score-complete-badge">
          <span class="score-trophy-icon">🏆</span>
          <span>SEMUA SOAL SELESAI</span>
        </div>
        <h2 class="score-modal-title" id="scoreModalTitle">Hasil & Skor Kuis Anda</h2>
        <div class="score-modal-subtitle">Transition Words & Connectors Quiz</div>
      </div>

      <div class="score-modal-body" id="scoreModalBody">
        <!-- Rendered dynamically by JavaScript -->
      </div>

      <div class="score-modal-footer">
        <button class="btn btn-secondary score-modal-btn" onclick="closeScoreModal()">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <span>Tinjau Pembahasan Soal</span>
        </button>
        <button class="btn btn-primary score-modal-btn" onclick="resetAllQuestions()">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
          <span>Ulangi Kuis</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    let questionsData = null;
    let currentQuestionIndex = 0;
    
    // Live question state: { [qId]: { answered: boolean, chosen: string, correct: string, isCorrect: boolean } }
    let liveQuestionsState = {};

    // Explanation visibility state per question: { [qId]: boolean } (default: hidden)
    let showExplanationState = {};

    // Sound FX mute state
    let isSfxMuted = false;

    document.addEventListener('DOMContentLoaded', () => {
      // Load questions.json with anti-cache timestamp
      fetch('questions.json?v=' + Date.now())
        .then(res => res.json())
        .then(data => {
          questionsData = data;
          if (document.getElementById('badgeResetCount')) {
            document.getElementById('badgeResetCount').innerText = questionsData.pg.length;
          }
          try {
            const savedState = localStorage.getItem('quiz_live_state');
            if (savedState) {
              liveQuestionsState = JSON.parse(savedState);
            }
          } catch(e) {}

          buildQuestionPills();
          renderFocusQuestion();
          updateScoreUI();
        })
        .catch(err => {
          console.error("Failed to load questions.json", err);
        });
    });

    // Sound FX Manager (No Background Music)
    function toggleSFX() {
      isSfxMuted = !isSfxMuted;
      const btn = document.getElementById('sfxToggleBtn');
      const iconWrap = document.getElementById('sfxIconWrap');
      if (isSfxMuted) {
        btn.classList.add('muted');
        btn.title = "Aktifkan Efek Suara";
        if (iconWrap) {
          iconWrap.innerHTML = `
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
              <path d="M18.63 13A17.89 17.89 0 0 1 18 8"></path>
              <path d="M6.26 6.26A5.86 5.86 0 0 0 6 8c0 7-3 9-3 9h14"></path>
              <path d="M18 8a6 6 0 0 0-9.33-5"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          `;
        }
      } else {
        btn.classList.remove('muted');
        btn.title = "Matikan Efek Suara";
        if (iconWrap) {
          iconWrap.innerHTML = `
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
          `;
        }
        playSfx('click');
      }
    }

    function playSfx(type) {
      if (isSfxMuted) return;
      try {
        if (type === 'correct') {
          AudioManager.correct();
        } else if (type === 'wrong') {
          AudioManager.wrong();
        } else if (type === 'success') {
          AudioManager.success();
        } else if (type === 'chime') {
          AudioManager.chime();
        } else if (type === 'spinTick') {
          AudioManager.spinTick();
        } else {
          AudioManager.click();
        }
      } catch (e) {
        console.warn("Audio SFX error", e);
      }
    }

    // Build Question Jump Pills (1 - 13)
    function buildQuestionPills() {
      const container = document.getElementById('questionPillsContainer');
      if (!container || !questionsData) return;

      container.innerHTML = "";
      questionsData.pg.forEach((q, idx) => {
        const pill = document.createElement('div');
        const isActive = (idx === currentQuestionIndex);
        
        let stateClass = "";
        let statusBadge = "";
        const state = liveQuestionsState[q.id];
        
        if (state) {
          if (state.isCorrect) {
            stateClass = " correct";
            statusBadge = `<span class="pill-status-dot">✓</span>`;
          } else {
            stateClass = " wrong";
            statusBadge = `<span class="pill-status-dot">✕</span>`;
          }
        }

        pill.className = `question-pill ${isActive ? 'active' : ''}${stateClass}`;
        pill.innerHTML = `<span>${idx + 1}</span>${statusBadge}`;
        pill.title = `Question ${idx + 1}: ${q.category}`;
        pill.onclick = () => jumpToQuestion(idx);
        container.appendChild(pill);
      });
    }

    function jumpToQuestion(idx) {
      if (!questionsData || idx < 0 || idx >= questionsData.pg.length) return;
      currentQuestionIndex = idx;
      renderFocusQuestion();
      buildQuestionPills();
      playSfx('click');
    }

    function prevQuestion() {
      if (currentQuestionIndex > 0) {
        jumpToQuestion(currentQuestionIndex - 1);
      }
    }

    function nextQuestion() {
      if (questionsData && currentQuestionIndex < questionsData.pg.length - 1) {
        jumpToQuestion(currentQuestionIndex + 1);
      }
    }

    // Render Current Question Card in Focus Mode
    function renderFocusQuestion() {
      const card = document.getElementById('currentFocusCard');
      if (!card || !questionsData) return;

      const q = questionsData.pg[currentQuestionIndex];
      const state = liveQuestionsState[q.id];
      const isAnswered = !!state;

      let optionsHtml = q.options.map(opt => {
        const letter = opt.trim().charAt(0);
        const optionText = cleanOptionText(opt);

        let itemClass = "option-btn";
        let badgeHtml = "";

        if (isAnswered) {
          if (letter.toUpperCase() === q.correct.toUpperCase()) {
            itemClass += " correct";
            badgeHtml = `<span class="opt-badge-tag correct"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg><span>Correct Answer</span></span>`;
          } else if (letter.toUpperCase() === state.chosen.toUpperCase() && !state.isCorrect) {
            itemClass += " wrong";
            badgeHtml = `<span class="opt-badge-tag wrong"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg><span>Chosen Option</span></span>`;
          } else {
            itemClass += " dimmed";
          }
        }

        return `
          <div class="${itemClass}" onclick="handleOptionSelect('${q.id}', '${letter}')">
            <div class="opt-letter-tag">${letter}</div>
            <div class="opt-text">${escapeHtml(optionText)}</div>
            ${badgeHtml}
          </div>
        `;
      }).join('');

      let explanationHtml = "";
      if (isAnswered) {
        const isCorrect = state.isCorrect;
        const isExplanationOpen = !!showExplanationState[q.id];

        const outcomeBadge = isCorrect 
          ? `<span class="outcome-badge-correct"><span class="pulse-dot-sm"></span><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg><span>JAWABAN BENAR</span></span>`
          : `<span class="outcome-badge-wrong"><span class="pulse-dot-sm" style="background:#ef4444;"></span><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg><span>JAWABAN KURANG TEPAT</span></span>`;
        
        const outcomeMsg = isCorrect
          ? `Tepat sekali! Pilihan Anda <strong>(${state.chosen})</strong> adalah jawaban yang benar.`
          : `Anda memilih opsi <strong>(${state.chosen})</strong>. Kunci jawaban yang benar adalah opsi <strong>(${q.correct})</strong>.`;

        explanationHtml = `
          <div class="explanation-card ${isCorrect ? 'is-correct' : 'is-wrong'}">
            <div class="explanation-header">
              ${outcomeBadge}
            </div>

            <div class="explanation-outcome-msg">
              ${outcomeMsg}
            </div>

            ${isExplanationOpen ? `
              <div class="explanation-body-box">
                <div class="explanation-body-title">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                  </svg>
                  Pembahasan & Penjelasan Soal:
                </div>
                <div class="explanation-body-text">
                  ${escapeHtml(q.explanation || 'Pembahasan materi transisi kata untuk soal ini.')}
                </div>
              </div>
            ` : ''}

            <div class="explanation-actions">
              <button class="btn-toggle-explain" onclick="toggleExplanation('${q.id}')">
                ${isExplanationOpen ? `
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                  </svg>
                  <span>Sembunyikan Pembahasan</span>
                ` : `
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <span>Lihat Pembahasan Soal</span>
                `}
              </button>
            </div>
          </div>
        `;
      }

      card.innerHTML = `
        <div class="q-card-header">
          <span class="q-counter-badge">
            Question ${currentQuestionIndex + 1} of ${questionsData.pg.length}
          </span>
        </div>

        <div class="passage-box">
          "${escapeHtml(q.q)}"
        </div>

        <p class="instruction-text">
          ${escapeHtml(q.instruction)}
        </p>

        <div class="options-list">
          ${optionsHtml}
        </div>

        ${explanationHtml}
      `;

      // Update Navigation button states
      const prevBtn = document.getElementById('btnPrevQ');
      const nextBtn = document.getElementById('btnNextQ');
      if (prevBtn) prevBtn.disabled = (currentQuestionIndex === 0);

      const stats = calculateQuizScore();
      if (nextBtn) {
        if (currentQuestionIndex === questionsData.pg.length - 1) {
          if (stats && stats.isAllAnswered) {
            nextBtn.disabled = false;
            nextBtn.onclick = openScoreModal;
            nextBtn.className = "btn btn-primary btn-nav btn-score-nav";
            nextBtn.innerHTML = `
              <span>🏆 Lihat Skor Akhir</span>
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            `;
          } else {
            nextBtn.disabled = true;
            nextBtn.onclick = nextQuestion;
            nextBtn.className = "btn btn-primary btn-nav";
            nextBtn.innerHTML = `
              <span>Next Question</span>
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            `;
          }
        } else {
          nextBtn.disabled = false;
          nextBtn.onclick = nextQuestion;
          nextBtn.className = "btn btn-primary btn-nav";
          nextBtn.innerHTML = `
            <span>Next Question</span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          `;
        }
      }
    }

    // Handle Option Selection
    function handleOptionSelect(qId, letter) {
      if (!questionsData) return;
      const q = questionsData.pg.find(item => item.id === qId);
      if (!q) return;

      if (liveQuestionsState[qId]) return;

      const isCorrect = (letter.toUpperCase() === q.correct.toUpperCase());

      // Save state lokal
      liveQuestionsState[qId] = {
        answered: true,
        chosen: letter,
        correct: q.correct,
        isCorrect: isCorrect
      };

      // Play Sound Effect & Confetti
      if (isCorrect) {
        playSfx('correct');
        triggerConfetti();
      } else {
        playSfx('wrong');
      }

      // Persist state
      try {
        localStorage.setItem('quiz_live_state', JSON.stringify(liveQuestionsState));
      } catch (e) {}

      // Re-render UI
      renderFocusQuestion();
      buildQuestionPills();
      updateScoreUI();

      // Check if all questions are answered! (MANDATORY score reveal)
      const currentStats = calculateQuizScore();
      if (currentStats && currentStats.isAllAnswered) {
        setTimeout(() => {
          triggerGrandConfetti();
          playSfx('success');
          openScoreModal();
        }, 450);
      }
    }

    function toggleExplanation(qId) {
      showExplanationState[qId] = !showExplanationState[qId];
      renderFocusQuestion();
      playSfx('click');
    }

    // Reset Current Question (Try Again)
    function resetCurrentQuestion() {
      if (!questionsData) return;
      const q = questionsData.pg[currentQuestionIndex];
      if (liveQuestionsState[q.id]) {
        delete liveQuestionsState[q.id];
        delete showExplanationState[q.id];
        try { localStorage.setItem('quiz_live_state', JSON.stringify(liveQuestionsState)); } catch (e) {}
      }
      renderFocusQuestion();
      buildQuestionPills();
      updateScoreUI();
      playSfx('click');
    }

    // Reset All Questions
    function resetAllQuestions() {
      if (confirm(`Reset seluruh ${questionsData.pg.length} soal untuk sesi kuis baru?`)) {
        liveQuestionsState = {};
        showExplanationState = {};
        try { localStorage.removeItem('quiz_live_state'); } catch (e) {}
        currentQuestionIndex = 0;
        closeScoreModal();
        renderFocusQuestion();
        buildQuestionPills();
        updateScoreUI();
        playSfx('click');
      }
    }

    // Calculate Quiz Score & Accuracy
    function calculateQuizScore() {
      if (!questionsData || !questionsData.pg) return null;
      const total = questionsData.pg.length;
      let answered = 0;
      let correct = 0;

      questionsData.pg.forEach(q => {
        const state = liveQuestionsState[q.id];
        if (state && state.answered) {
          answered++;
          if (state.isCorrect) correct++;
        }
      });

      const wrong = answered - correct;
      const score = Math.round((correct / total) * 100);
      const accuracy = total > 0 ? ((correct / total) * 100).toFixed(0) : 0;
      const isAllAnswered = (answered === total && total > 0);

      return {
        total,
        answered,
        correct,
        wrong,
        score,
        accuracy,
        isAllAnswered
      };
    }

    // Render Modal Content
    function renderScoreModalContent(stats) {
      let gradeTitle = "";
      let gradeDesc = "";
      let scoreColorClass = "";

      if (stats.score === 100) {
        gradeTitle = "🌟 Sempurna! (Perfect Score)";
        gradeDesc = "Luar biasa! Seluruh 13 soal Transition Words dijawab dengan tepat.";
        scoreColorClass = "score-perfect";
      } else if (stats.score >= 80) {
        gradeTitle = "👏 Sangat Baik!";
        gradeDesc = "Pemahaman Anda tentang materi Transition Words & Connectors sangat memuaskan.";
        scoreColorClass = "score-great";
      } else if (stats.score >= 60) {
        gradeTitle = "👍 Cukup Baik!";
        gradeDesc = "Sebagian besar konsep transisi sudah dipahami dengan baik.";
        scoreColorClass = "score-good";
      } else {
        gradeTitle = "💪 Tetap Semangat!";
        gradeDesc = "Pelajari kembali pembahasan setiap soal untuk memperdalam pemahaman Transition Words.";
        scoreColorClass = "score-keepgoing";
      }

      return `
        <div class="score-hero ${scoreColorClass}">
          <div class="score-circle-wrapper">
            <div class="score-circle-inner">
              <span class="score-val">${stats.score}</span>
              <span class="score-max">/ 100</span>
            </div>
          </div>
          <div class="score-feedback-box">
            <h3 class="score-grade-title">${gradeTitle}</h3>
            <p class="score-grade-desc">${gradeDesc}</p>
          </div>
        </div>

        <div class="score-stats-grid">
          <div class="score-stat-card card-correct">
            <div class="stat-icon-wrap">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
            <div class="stat-content">
              <div class="stat-label">Jawaban Benar</div>
              <div class="stat-value text-emerald">${stats.correct} <small>/ ${stats.total}</small></div>
            </div>
          </div>

          <div class="score-stat-card card-wrong">
            <div class="stat-icon-wrap">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </div>
            <div class="stat-content">
              <div class="stat-label">Jawaban Salah</div>
              <div class="stat-value text-rose">${stats.wrong} <small>/ ${stats.total}</small></div>
            </div>
          </div>

          <div class="score-stat-card card-accuracy">
            <div class="stat-icon-wrap">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 6v6l4 2"></path>
              </svg>
            </div>
            <div class="stat-content">
              <div class="stat-label">Akurasi</div>
              <div class="stat-value text-cyan">${stats.accuracy}%</div>
            </div>
          </div>

          <div class="score-stat-card card-total">
            <div class="stat-icon-wrap">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
              </svg>
            </div>
            <div class="stat-content">
              <div class="stat-label">Total Soal</div>
              <div class="stat-value text-indigo">${stats.total} Soal</div>
            </div>
          </div>
        </div>
      `;
    }

    function openScoreModal() {
      const stats = calculateQuizScore();
      if (!stats) return;
      const modal = document.getElementById('quizScoreModal');
      const body = document.getElementById('scoreModalBody');
      if (!modal || !body) return;

      body.innerHTML = renderScoreModalContent(stats);
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
      playSfx('chime');
    }

    function closeScoreModal() {
      const modal = document.getElementById('quizScoreModal');
      if (modal) {
        modal.classList.remove('active');
        document.body.style.overflow = '';
      }
      playSfx('click');
    }

    function handleScoreModalOverlayClick(e) {
      if (e.target && e.target.id === 'quizScoreModal') {
        closeScoreModal();
      }
    }

    // Update Persistent Score Banner & Strip Badge
    function updateScoreUI() {
      const stats = calculateQuizScore();
      const bannerEl = document.getElementById('completionBannerContainer');
      const stripBadgeEl = document.getElementById('stripScoreBadgeContainer');

      if (!stats || !stats.isAllAnswered) {
        if (bannerEl) bannerEl.innerHTML = "";
        if (stripBadgeEl) stripBadgeEl.innerHTML = "";
        return;
      }

      if (bannerEl) {
        bannerEl.innerHTML = `
          <div class="completion-banner">
            <div class="completion-banner-left">
              <div class="completion-trophy-badge">🏆</div>
              <div class="completion-info">
                <div class="completion-title">
                  Semua Soal Telah Selesai! Skor Akhir: <span class="score-highlight">${stats.score} / 100</span>
                </div>
                <div class="completion-sub">
                  Benar ${stats.correct} dari ${stats.total} Soal • Tingkat Akurasi ${stats.accuracy}%
                </div>
              </div>
            </div>
            <button class="btn-open-score" onclick="openScoreModal()">
              <span>Lihat Ringkasan Skor</span>
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
          </div>
        `;
      }

      if (stripBadgeEl) {
        stripBadgeEl.innerHTML = `
          <button class="btn-strip-score" onclick="openScoreModal()" title="Buka Ringkasan Skor Akhir">
            <span>🏆 Skor: <strong>${stats.score}</strong>/100</span>
          </button>
        `;
      }
    }

    // Grand Celebration Multi-wave Confetti
    function triggerGrandConfetti() {
      if (typeof confetti !== 'function') return;
      confetti({
        particleCount: 110,
        spread: 85,
        origin: { y: 0.55 }
      });
      setTimeout(() => {
        confetti({
          particleCount: 80,
          angle: 60,
          spread: 60,
          origin: { x: 0.05, y: 0.6 }
        });
        confetti({
          particleCount: 80,
          angle: 120,
          spread: 60,
          origin: { x: 0.95, y: 0.6 }
        });
      }, 300);
    }

    // Clean Option Text helper
    function cleanOptionText(opt) {
      return opt.replace(/^[A-D][\.\)]\s*/i, '').trim();
    }

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 90,
          spread: 75,
          origin: { y: 0.6 }
        });
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>

</html>
