<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Quiz Show: Transition Words & Connectors</title>

  <!-- Prevent Aggressive Browser Caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Modern Fonts & Styles -->
  <link rel="stylesheet" href="assets/style.css" />

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Local App Modules -->
  <script src="assets/audio.js"></script>
</head>

<body>
  <div class="container">

    <!-- Top Navigation Header -->
    <header class="top-navbar" style="margin-bottom: 24px;">
      <div class="brand-wrapper">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <polygon
              points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
            </polygon>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">Transition Words Quiz Show</h1>
          <div class="brand-subtitle">Interactive Presentation • Elsa • Sofia • Irfan • Ahmad</div>
        </div>
      </div>

      <!-- Right Header: Sound FX Toggle & Live Session Badge -->
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="sfx-toggle-btn" onclick="toggleSFX()" id="sfxToggleBtn" title="Toggle Sound Effects">
          <span id="sfxIconWrap">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
          </span>
        </button>

        <span class="badge badge-live" title="Interactive Presentation Screen">
          <span class="pulse-dot"></span>
          <span>Live Session</span>
        </span>
      </div>
    </header>

    <!-- Main Question View (Pure Multiple Choice Quiz) -->
    <div id="tabContentPg" class="tab-pane active" style="display:block;">

      <!-- Question Jump Strip (Navigator) -->
      <div class="question-strip-wrapper">
        <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
          <span class="navigator-label">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>Navigator Soal:</span>
          </span>
          <div class="question-pills-grid" id="questionPillsContainer">
            <!-- Circular Pills 1 to 13 generated via JS -->
          </div>
        </div>
        <div>
          <button class="btn-reset-session" onclick="resetAllQuestions()" title="Reset semua jawaban untuk sesi kuis baru">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 2v6h-6"></path>
              <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
              <path d="M3 22v-6h6"></path>
              <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
            </svg>
            <span>Reset Jawaban</span>
            <span class="badge-reset-count" id="badgeResetCount"></span>
          </button>
        </div>
      </div>

      <!-- Focus Game Show Card -->
      <div id="focusModeContainer">
        <div class="focus-question-box" id="currentFocusCard">
          <div style="text-align:center; padding: 40px; color: var(--text-dim);">Loading interactive question bank...</div>
        </div>

        <!-- Bottom Navigation Bar -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top: 20px; flex-wrap:wrap; gap:12px;">
          <button class="btn btn-secondary" onclick="prevQuestion()" id="btnPrevQ">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Previous Question</span>
          </button>

          <button class="btn btn-primary" onclick="nextQuestion()" id="btnNextQ">
            <span>Next Question</span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>
      </div>

    </div>

  </div>

  <script>
    let questionsData = null;
    let currentQuestionIndex = 0;
    
    // Live question state: { [qId]: { answered: boolean, chosen: string, correct: string, isCorrect: boolean } }
    let liveQuestionsState = {};

    // Explanation visibility state per question: { [qId]: boolean } (default: hidden)
    let showExplanationState = {};

    // Sound FX mute state
    let isSfxMuted = false;

    document.addEventListener('DOMContentLoaded', () => {
      // Load questions.json with anti-cache timestamp
      fetch('questions.json?v=' + Date.now())
        .then(res => res.json())
        .then(data => {
          questionsData = data;
          if (document.getElementById('badgeResetCount')) {
            document.getElementById('badgeResetCount').innerText = questionsData.pg.length;
          }
          try {
            const savedState = localStorage.getItem('quiz_live_state');
            if (savedState) {
              liveQuestionsState = JSON.parse(savedState);
            }
          } catch(e) {}

          buildQuestionPills();
          renderFocusQuestion();
        })
        .catch(err => {
          console.error("Failed to load questions.json", err);
        });
    });

    // Sound FX Manager (No Background Music)
    function toggleSFX() {
      isSfxMuted = !isSfxMuted;
      const btn = document.getElementById('sfxToggleBtn');
      const iconWrap = document.getElementById('sfxIconWrap');
      if (isSfxMuted) {
        btn.classList.add('muted');
        btn.title = "Aktifkan Efek Suara";
        if (iconWrap) {
          iconWrap.innerHTML = `
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
              <path d="M18.63 13A17.89 17.89 0 0 1 18 8"></path>
              <path d="M6.26 6.26A5.86 5.86 0 0 0 6 8c0 7-3 9-3 9h14"></path>
              <path d="M18 8a6 6 0 0 0-9.33-5"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          `;
        }
      } else {
        btn.classList.remove('muted');
        btn.title = "Matikan Efek Suara";
        if (iconWrap) {
          iconWrap.innerHTML = `
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
          `;
        }
        playSfx('click');
      }
    }

    function playSfx(type) {
      if (isSfxMuted) return;
      try {
        if (type === 'correct') {
          AudioManager.correct();
        } else if (type === 'wrong') {
          AudioManager.wrong();
        } else if (type === 'chime') {
          AudioManager.chime();
        } else if (type === 'spinTick') {
          AudioManager.spinTick();
        } else {
          AudioManager.click();
        }
      } catch (e) {
        console.warn("Audio SFX error", e);
      }
    }

    // Build Question Jump Pills (1 - 13)
    function buildQuestionPills() {
      const container = document.getElementById('questionPillsContainer');
      if (!container || !questionsData) return;

      container.innerHTML = "";
      questionsData.pg.forEach((q, idx) => {
        const pill = document.createElement('div');
        const isActive = (idx === currentQuestionIndex);
        
        let stateClass = "";
        let statusBadge = "";
        const state = liveQuestionsState[q.id];
        
        if (state) {
          if (state.isCorrect) {
            stateClass = " correct";
            statusBadge = `<span style="font-size:0.7rem; margin-left:2px;">✓</span>`;
          } else {
            stateClass = " wrong";
            statusBadge = `<span style="font-size:0.7rem; margin-left:2px;">✕</span>`;
          }
        }

        pill.className = `question-pill ${isActive ? 'active' : ''}${stateClass}`;
        pill.innerHTML = `<span>${idx + 1}</span>${statusBadge}`;
        pill.title = `Question ${idx + 1}: ${q.category}`;
        pill.onclick = () => jumpToQuestion(idx);
        container.appendChild(pill);
      });
    }

    function jumpToQuestion(idx) {
      if (!questionsData || idx < 0 || idx >= questionsData.pg.length) return;
      currentQuestionIndex = idx;
      renderFocusQuestion();
      buildQuestionPills();
      playSfx('click');
    }

    function prevQuestion() {
      if (currentQuestionIndex > 0) {
        jumpToQuestion(currentQuestionIndex - 1);
      }
    }

    function nextQuestion() {
      if (questionsData && currentQuestionIndex < questionsData.pg.length - 1) {
        jumpToQuestion(currentQuestionIndex + 1);
      }
    }

    // Render Current Question Card in Focus Mode
    function renderFocusQuestion() {
      const card = document.getElementById('currentFocusCard');
      if (!card || !questionsData) return;

      const q = questionsData.pg[currentQuestionIndex];
      const state = liveQuestionsState[q.id];
      const isAnswered = !!state;

      let optionsHtml = q.options.map(opt => {
        const letter = opt.trim().charAt(0);
        const optionText = cleanOptionText(opt);

        let itemClass = "option-btn";
        let badgeHtml = "";

        if (isAnswered) {
          if (letter.toUpperCase() === q.correct.toUpperCase()) {
            itemClass += " correct";
            badgeHtml = `<span class="opt-badge-tag correct">✅ Correct Answer</span>`;
          } else if (letter.toUpperCase() === state.chosen.toUpperCase() && !state.isCorrect) {
            itemClass += " wrong";
            badgeHtml = `<span class="opt-badge-tag wrong">❌ Chosen Option</span>`;
          } else {
            itemClass += " dimmed";
          }
        }

        return `
          <div class="${itemClass}" onclick="handleOptionSelect('${q.id}', '${letter}')">
            <div class="opt-letter-tag">${letter}</div>
            <div class="opt-text">${escapeHtml(optionText)}</div>
            ${badgeHtml}
          </div>
        `;
      }).join('');

      let explanationHtml = "";
      if (isAnswered) {
        const isCorrect = state.isCorrect;
        const isExplanationOpen = !!showExplanationState[q.id];

        const outcomeBadge = isCorrect 
          ? `<span style="display:inline-flex; align-items:center; gap:6px; background:rgba(16,185,129,0.22); color:#34d399; border:1px solid rgba(16,185,129,0.45); padding:5px 14px; border-radius:99px; font-size:0.92rem; font-weight:800;"><span class="pulse-dot-sm"></span> ✅ JAWABAN BENAR</span>`
          : `<span style="display:inline-flex; align-items:center; gap:6px; background:rgba(239,68,68,0.22); color:#f87171; border:1px solid rgba(239,68,68,0.45); padding:5px 14px; border-radius:99px; font-size:0.92rem; font-weight:800;">✕ JAWABAN KURANG TEPAT</span>`;
        
        const outcomeMsg = isCorrect
          ? `Tepat sekali! Pilihan Anda <strong>(${state.chosen})</strong> adalah jawaban yang benar.`
          : `Anda memilih opsi <strong>(${state.chosen})</strong>. Kunci jawaban yang benar adalah opsi <strong>(${q.correct})</strong>.`;

        const borderStyle = isCorrect 
          ? "border-left: 5px solid #10b981; border-color: rgba(16, 185, 129, 0.45); background: linear-gradient(135deg, rgba(16, 36, 26, 0.92), rgba(10, 20, 16, 0.98));" 
          : "border-left: 5px solid #ef4444; border-color: rgba(239, 68, 68, 0.45); background: linear-gradient(135deg, rgba(38, 20, 24, 0.92), rgba(20, 12, 14, 0.98));";

        explanationHtml = `
          <div class="explanation-card" style="${borderStyle}; margin-top:22px; padding:20px 24px; border-radius:var(--radius-lg); box-shadow:0 12px 30px rgba(0,0,0,0.4);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:10px;">
              ${outcomeBadge}
              <span style="font-size:0.86rem; color:#a5b4fc; font-weight:700; background:rgba(99,102,241,0.2); border:1px solid rgba(99,102,241,0.4); padding:4px 12px; border-radius:8px;">
                📘 Materi: ${escapeHtml(q.category)}
              </span>
            </div>

            <div style="font-size:1.06rem; color:#f8fafc; margin-bottom:14px; font-weight:600; line-height:1.5;">
              ${outcomeMsg}
            </div>

            ${isExplanationOpen ? `
              <div style="border-top:1px solid rgba(255,255,255,0.1); padding-top:14px; margin-top:14px; animation: fadeIn 0.25s ease;">
                <div style="font-size:0.88rem; text-transform:uppercase; letter-spacing:0.6px; color:#38bdf8; font-weight:800; margin-bottom:8px; display:flex; align-items:center; gap:8px;">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                  </svg>
                  Pembahasan & Penjelasan Soal:
                </div>
                <div class="explanation-text" style="font-size:1rem; line-height:1.7; color:#f1f5f9; background: rgba(0,0,0,0.25); padding: 14px 18px; border-radius: 10px; border-left: 3px solid #38bdf8;">
                  ${escapeHtml(q.explanation || 'Pembahasan materi transisi kata untuk soal ini.')}
                </div>
              </div>
            ` : ''}

            <div style="margin-top:18px; padding-top:14px; border-top:1px dashed rgba(255,255,255,0.12); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
              <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                <button class="btn btn-secondary btn-sm" onclick="toggleExplanation('${q.id}')" style="font-size:0.84rem; padding:7px 16px; border-color:rgba(56,189,248,0.4); color:#38bdf8; background:rgba(56,189,248,0.1); gap:6px;">
                  ${isExplanationOpen ? `
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                      <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                    <span>🙈 Sembunyikan Pembahasan</span>
                  ` : `
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <span>💡 Lihat Pembahasan Soal</span>
                  `}
                </button>

                <button class="btn btn-secondary btn-sm" onclick="resetCurrentQuestion()" style="font-size:0.84rem; padding:7px 16px; border-color:rgba(148,163,184,0.35); color:#cbd5e1; gap:6px;">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="1 4 1 10 7 10"></polyline>
                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                  </svg>
                  <span>Coba Jawab Ulang</span>
                </button>
              </div>

              ${currentQuestionIndex < questionsData.pg.length - 1 ? `
                <button class="btn btn-primary btn-sm" onclick="nextQuestion()" style="font-size:0.84rem; padding:7px 18px; gap:6px;">
                  <span>Lanjut Soal Berikutnya</span>
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                  </svg>
                </button>
              ` : `
                <button class="btn btn-primary btn-sm" onclick="jumpToQuestion(0)" style="font-size:0.84rem; padding:7px 18px; gap:6px;">
                  <span>🎉 Selesai (Kembali ke Soal 1)</span>
                </button>
              `}
            </div>
          </div>
        `;
      }

      card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px; flex-wrap:wrap; gap:8px;">
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="badge badge-room" style="font-size:0.92rem; padding:6px 14px; font-weight:800; background:rgba(99,102,241,0.18);">
              Question ${currentQuestionIndex + 1} of ${questionsData.pg.length}
            </span>
          </div>
          <span style="font-size:0.86rem; color:#a5b4fc; font-weight:700; background:rgba(99,102,241,0.15); border:1px solid rgba(99,102,241,0.3); padding:4px 12px; border-radius:8px;">
            📘 ${escapeHtml(q.category)}
          </span>
        </div>

        <div class="passage-box" style="font-size: 1.26rem; line-height: 1.65; margin-bottom: 18px; color: #f8fafc; font-style: normal; border-left: 4px solid #6366f1;">
          "${escapeHtml(q.q)}"
        </div>

        <p style="font-size: 1.05rem; font-weight: 700; color: #cbd5e1; margin-bottom: 18px;">
          ${escapeHtml(q.instruction)}
        </p>

        <div class="options-list">
          ${optionsHtml}
        </div>

        ${explanationHtml}
      `;

      // Update Navigation button states
      const prevBtn = document.getElementById('btnPrevQ');
      const nextBtn = document.getElementById('btnNextQ');
      if (prevBtn) prevBtn.disabled = (currentQuestionIndex === 0);
      if (nextBtn) nextBtn.disabled = (currentQuestionIndex === questionsData.pg.length - 1);
    }

    // Handle Option Selection
    function handleOptionSelect(qId, letter) {
      if (!questionsData) return;
      const q = questionsData.pg.find(item => item.id === qId);
      if (!q) return;

      if (liveQuestionsState[qId]) return;

      const isCorrect = (letter.toUpperCase() === q.correct.toUpperCase());

      // Save state lokal
      liveQuestionsState[qId] = {
        answered: true,
        chosen: letter,
        correct: q.correct,
        isCorrect: isCorrect
      };

      // Play Sound Effect & Confetti
      if (isCorrect) {
        playSfx('correct');
        triggerConfetti();
      } else {
        playSfx('wrong');
      }

      // Persist state
      try {
        localStorage.setItem('quiz_live_state', JSON.stringify(liveQuestionsState));
      } catch (e) {}

      // Re-render UI
      renderFocusQuestion();
      buildQuestionPills();
    }

    function toggleExplanation(qId) {
      showExplanationState[qId] = !showExplanationState[qId];
      renderFocusQuestion();
      playSfx('click');
    }

    // Reset Current Question (Try Again)
    function resetCurrentQuestion() {
      if (!questionsData) return;
      const q = questionsData.pg[currentQuestionIndex];
      if (liveQuestionsState[q.id]) {
        delete liveQuestionsState[q.id];
        delete showExplanationState[q.id];
        try { localStorage.setItem('quiz_live_state', JSON.stringify(liveQuestionsState)); } catch (e) {}
      }
      renderFocusQuestion();
      buildQuestionPills();
      playSfx('click');
    }

    // Reset All Questions
    function resetAllQuestions() {
      if (confirm(`Reset seluruh ${questionsData.pg.length} soal untuk sesi kuis baru?`)) {
        liveQuestionsState = {};
        showExplanationState = {};
        try { localStorage.removeItem('quiz_live_state'); } catch (e) {}
        currentQuestionIndex = 0;
        renderFocusQuestion();
        buildQuestionPills();
        playSfx('click');
      }
    }

    // Clean Option Text helper
    function cleanOptionText(opt) {
      return opt.replace(/^[A-D][\.\)]\s*/i, '').trim();
    }

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 90,
          spread: 75,
          origin: { y: 0.6 }
        });
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>

</html>
